name: RDP + Tailscale + Dev Environment (macOS)

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Hostname for this RDP instance (e.g. myserver, dev-machine)"
        required: true
        default: "bullet"
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
      quick_test:
        description: "Run 5-minute test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime (max 360; default 355)"
        default: "355"
      do_purge:
        description: "Purge matching hostname devices at start"
        default: "true"
      rdp_count:
        description: "How many RDP instances (1-10)"
        default: "1"
      rdp_username:
        description: "RDP Username (default: bulletuser)"
        default: "bulletuser"
      rdp_password:
        description: "RDP Password (default: Bullet@12345)"
        default: "Bullet@12345"
      vnc_password:
        description: "VNC Password (max 8 chars, default: vnc12345)"
        default: "vnc12345"
      bonsai_api_key:
        description: "Bonsai API Key (optional, for Claude Code)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: mk
        run: |
          n=${{ inputs.rdp_count }}
          if [ "$n" -lt 1 ]; then n=1; fi
          if [ "$n" -gt 10 ]; then n=10; fi
          
          include="["
          for i in $(seq 1 $n); do
            if [ $i -gt 1 ]; then include+=","; fi
            include+="{\"id\": $i}"
          done
          include+="]"
          
          echo "matrix={\"include\":$include}" >> $GITHUB_OUTPUT
          echo "Matrix: $include"

  purge-devices:
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ inputs.do_purge == 'true' }}
    steps:
      - name: Purge old devices matching hostname
        env:
          TS_TAILNET: ${{ inputs.ts_tailnet }}
          TS_API_KEY: ${{ inputs.ts_api_key }}
          HOSTNAME_INPUT: ${{ inputs.hostname }}
        run: |
          hostname_pattern="${HOSTNAME_INPUT:-bullet}"
          
          devices=$(curl -s -H "Authorization: Bearer $TS_API_KEY" \
            "https://api.tailscale.com/api/v2/tailnet/$TS_TAILNET/devices")
          
          echo "$devices" | jq -r ".devices[] | select(.hostname | contains(\"$hostname_pattern\")) | .id" | while read device_id; do
            if [ -n "$device_id" ]; then
              echo "Deleting device: $device_id"
              curl -s -X DELETE -H "Authorization: Bearer $TS_API_KEY" \
                "https://api.tailscale.com/api/v2/device/$device_id"
            fi
          done

  rdp:
    needs: [setup, purge-devices]
    if: always() && needs.setup.result == 'success'
    runs-on: macos-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false
    timeout-minutes: 370

    env:
      RDP_USER: ${{ inputs.rdp_username }}
      RDP_PASS: ${{ inputs.rdp_password }}
      VNC_PASS: ${{ inputs.vnc_password }}

    steps:
      - name: Set hostname + runtime
        run: |
          # Set hostname
          hostname="${{ inputs.hostname }}"
          if [ -z "$hostname" ]; then
            rdp_count=${{ inputs.rdp_count }}
            if [ "$rdp_count" -gt 1 ]; then
              hostname="bullet${{ matrix.id }}"
            else
              hostname="bullet"
            fi
          fi
          echo "TS_HOSTNAME=$hostname" >> $GITHUB_ENV
          echo "Hostname: $hostname"

          # Set runtime
          runtime=${{ inputs.runtime_minutes }}
          if [ "${{ inputs.quick_test }}" = "true" ]; then
            runtime=5
          fi
          if [ "$runtime" -lt 1 ]; then runtime=355; fi
          if [ "$runtime" -gt 360 ]; then runtime=355; fi
          echo "RUNTIME_MINUTES=$runtime" >> $GITHUB_ENV
          echo "Runtime: $runtime minutes"

      - name: Install Tailscale
        run: |
          # Install Tailscale via Homebrew (more reliable on macOS)
          brew install tailscale
          
          # Link tailscale binary
          brew link tailscale
          
          echo "Tailscale installed"
          which tailscale || echo "Tailscale not in PATH, adding..."
          
          # Add to PATH if needed
          export PATH="/opt/homebrew/bin:$PATH"
          tailscale version

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          # Ensure Tailscale is in PATH
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          
          # Check if tailscaled daemon is running, start if not
          sudo launchctl list | grep tailscale || sudo brew services start tailscale || true
          sleep 3
          
          # Logout first (ignore errors)
          sudo tailscale logout 2>/dev/null || true
          sleep 2
          
          # Connect to Tailscale
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="$TS_HOSTNAME" --accept-dns --accept-routes
          sleep 10
          
          TS_IP=$(tailscale ip -4 2>/dev/null || echo "unknown")
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: Install Homebrew Packages
        run: |
          # Update Homebrew
          brew update
          
          # Install essential tools
          brew install git curl wget vim nano htop neofetch jq
          
          # Install VNC server alternative (TigerVNC)
          brew install tigervnc
          
          # Install Python
          brew install python@3.12
          
          # Install Node.js
          brew install node@22
          
          echo "============================================"
          echo "Homebrew packages installed!"
          echo "============================================"

      - name: Create User Account
        run: |
          # Check if user already exists
          if id "$RDP_USER" &>/dev/null; then
            echo "User $RDP_USER already exists"
          else
            # Create user using sysadminctl
            sudo sysadminctl -addUser "$RDP_USER" -password "$RDP_PASS" -admin
            echo "Created user: $RDP_USER"
          fi
          
          # Verify user
          id "$RDP_USER"

      - name: Configure VNC Server
        run: |
          # Create VNC password file directory
          mkdir -p ~/.vnc
          
          # Set VNC password (max 8 characters)
          vnc_pass="${VNC_PASS:0:8}"
          
          # Create password using vncpasswd
          echo "$vnc_pass" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          # Create VNC xstartup file for the user
          mkdir -p /Users/$RDP_USER/.vnc
          cat > /Users/$RDP_USER/.vnc/xstartup << 'EOF'
          #!/bin/bash
          # Start a simple terminal session
          export SHELL=/bin/zsh
          exec /bin/zsh -l
          EOF
          chmod +x /Users/$RDP_USER/.vnc/xstartup
          
          # Copy passwd to user's VNC directory
          cp ~/.vnc/passwd /Users/$RDP_USER/.vnc/passwd
          chown -R $RDP_USER:staff /Users/$RDP_USER/.vnc
          
          echo "============================================"
          echo "VNC Server Configured!"
          echo "VNC Password: ${VNC_PASS:0:8}"
          echo "============================================"

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          # Enable Screen Sharing via launchctl
          sudo launchctl enable system/com.apple.screensharing || true
          
          # Alternative: Enable ARD (Apple Remote Desktop) agent
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restartopts -now -privs -all
          
          # Set VNC password for Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "${VNC_PASS:0:8}"
          
          echo "============================================"
          echo "macOS Screen Sharing Enabled!"
          echo "Connect via VNC to: $TAILSCALE_IP:5900"
          echo "VNC Password: ${VNC_PASS:0:8}"
          echo "============================================"

      - name: Install Python Packages
        run: |
          # Ensure pip is up to date
          python3 -m pip install --upgrade pip
          
          # Install popular Python packages
          pip3 install --user requests numpy pandas flask fastapi uvicorn httpx aiohttp pillow pytest
          
          echo "============================================"
          echo "Python Ready!"
          python3 --version
          pip3 --version
          echo "============================================"

      - name: Install Node.js + npm packages
        run: |
          # Add Node.js to PATH (brew installs to opt)
          export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
          
          node --version
          npm --version
          
          # Install global packages
          npm install -g typescript ts-node nodemon pm2 yarn pnpm
          
          echo "============================================"
          echo "Node.js Ready!"
          echo "============================================"

      - name: Install Bonsai CLI (Claude Code)
        env:
          BONSAI_API_KEY: ${{ inputs.bonsai_api_key }}
        run: |
          # Install Bonsai CLI
          npm install -g @bonsai-ai/cli
          
          # Configure Bonsai if API key provided
          if [ -n "$BONSAI_API_KEY" ]; then
            mkdir -p ~/.bonsai
            echo "API_KEY=$BONSAI_API_KEY" > ~/.bonsai/config
            chmod 600 ~/.bonsai/config
            echo "Bonsai CLI configured with API key"
          fi
          
          echo "============================================"
          echo "Bonsai CLI Ready!"
          echo "Run 'bonsai' in terminal to start"
          echo "See: https://docs.trybons.ai/introduction"
          echo "============================================"

      - name: Install VS Code (code-server)
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh
          
          # Configure code-server
          mkdir -p ~/.config/code-server
          cat > ~/.config/code-server/config.yaml << EOF
          bind-addr: 0.0.0.0:8080
          auth: password
          password: $RDP_PASS
          cert: false
          EOF
          
          echo "============================================"
          echo "VS Code (code-server) Ready!"
          echo "Access at: http://localhost:8080"
          echo "Password: $RDP_PASS"
          echo "============================================"

      - name: Start VNC and Services
        run: |
          # Start TigerVNC server on display :1
          vncserver :1 -geometry 1920x1080 -depth 24
          
          # Start code-server in background
          code-server &
          
          echo "============================================"
          echo "All Services Started!"
          echo ""
          echo "Connection Info:"
          echo "  VNC: $TAILSCALE_IP:5901 (TigerVNC)"
          echo "  Screen Sharing: $TAILSCALE_IP:5900 (macOS built-in)"
          echo "  VS Code: http://$TAILSCALE_IP:8080"
          echo ""
          echo "User: $RDP_USER"
          echo "Password: $RDP_PASS"
          echo "VNC Password: ${VNC_PASS:0:8}"
          echo "============================================"

      - name: Keep alive
        run: |
          end=$((SECONDS + RUNTIME_MINUTES * 60))
          iteration=0

          echo "Keep-alive started. Will run for $RUNTIME_MINUTES minutes"

          while [ $SECONDS -lt $end ]; do
            iteration=$((iteration + 1))
            remaining=$(( (end - SECONDS) / 60 ))
            echo "[$iteration] Alive at $(date '+%H:%M:%S') | VNC: $RDP_USER @ $TAILSCALE_IP | Remaining: $remaining min"
            sleep 60
          done

          echo "Runtime completed at $(date)"

      - name: Cleanup on exit
        if: always()
        run: |
          echo "Cleaning up..."

          # Ensure PATH includes Homebrew
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Logout from Tailscale
          sudo tailscale logout 2>/dev/null || true
          echo "Logged out from Tailscale"

          # Stop VNC server
          vncserver -kill :1 || true
          
          # Stop code-server
          pkill code-server || true
          
          # Disable Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -deactivate -stop || true

          echo "Cleanup completed"
